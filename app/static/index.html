<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyMails · 智能邮件助手</title>
  <link rel="stylesheet" href="/static/style.css?v=4">
  <link rel="stylesheet" href="/static/priority.css?v=4">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">M</span><div><b>MyMails</b><small>智能邮件助手</small></div></div>
      <button class="compose-primary" data-compose><span>＋</span> 写邮件</button>
      <nav aria-label="邮件夹">
        <button class="nav-item active" data-folder="INBOX"><span>▰</span>收件箱<i id="inboxCount"></i></button>
        <button class="nav-item" data-filter="starred"><span>☆</span>星标邮件</button>
        <button class="nav-item" data-folder="Sent"><span>➤</span>已发送</button>
        <button class="nav-item" data-view="todos"><span>✓</span>提醒与待办<i id="todoCount"></i></button>
        <button class="nav-item" data-view="rules"><span>⚙</span>分类规则</button>
        <button class="nav-item" data-folder="Trash"><span>♲</span>回收站</button>
      </nav>
      <div class="sidebar-help"><span>?</span><div><b>需要帮助？</b><small>遇到问题时，可查看操作提示</small></div></div>
      <div class="account"><span id="avatar">我</span><div><b>我的邮箱</b><small id="accountAddress">正在读取…</small></div><i class="status-dot"></i></div>
    </aside>

    <main>
      <header>
        <button class="icon mobile-only" id="menuButton" aria-label="打开菜单">☰</button>
        <div class="search"><span>⌕</span><input id="searchInput" placeholder="搜索发件人或主题"><kbd>回车</kbd></div>
        <select id="accountSelect" class="priority-select" aria-label="选择邮箱"><option value="all">全部邮箱</option></select>
        <button class="icon" id="refreshButton" title="刷新">↻</button>
        <button class="compose-mobile mobile-only" data-compose>＋ 写邮件</button>
      </header>

      <section class="mail-view">
        <div class="list-pane">
          <div class="list-heading"><div><h1 id="folderTitle">收件箱</h1><p id="folderSubtitle">最新邮件排在最前面</p></div><select id="filterSelect" aria-label="筛选"><option value="all">全部邮件</option><option value="urgent">紧急 !!!</option><option value="normal">普通 !!</option><option value="low">低 !</option><option value="unread">只看未读</option><option value="starred">只看星标</option></select></div>
          <div id="mailList" class="mail-list" aria-live="polite"></div>
        </div>
        <article class="detail-pane" id="detailPane">
          <div class="empty-detail"><div class="empty-art">✉</div><h2>选择一封邮件查看</h2><p>点击左侧任意邮件，就能阅读正文、生成摘要或快速回复。</p></div>
        </article>
      </section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="composeModal">
    <section class="compose-card" role="dialog" aria-modal="true" aria-labelledby="composeTitle">
      <div class="compose-head"><div><h2 id="composeTitle">写邮件</h2><p>填写下面三项，就可以发送</p></div><button class="icon" data-close>×</button></div>
      <form id="composeForm">
        <label>发件邮箱<select name="account" id="sendAccount" class="priority-select"></select></label>
        <label>发给谁？<input name="to" type="email" required placeholder="例如：friend@example.com"></label>
        <label>邮件主题<input name="subject" placeholder="用一句话说明邮件内容"></label>
        <label>邮件正文<textarea name="body" required rows="10" placeholder="在这里写下你想说的话…"></textarea></label>
        <div class="compose-actions"><span id="draftStatus">内容会保留到关闭窗口前</span><button type="button" class="secondary" data-close>取消</button><button type="submit" class="primary">发送邮件 <span>➤</span></button></div>
      </form>
    </section>
  </div>
  <div class="modal-backdrop hidden" id="todoModal">
    <section class="compose-card todo-card" role="dialog" aria-modal="true" aria-labelledby="todoTitle">
      <div class="compose-head"><div><h2 id="todoTitle">设置提醒或待办</h2><p>到期事项会在待办页面优先显示</p></div><button class="icon" data-todo-close>×</button></div>
      <form id="todoForm">
        <label>要做什么？<input name="title" required placeholder="例如：回复这封邮件"></label>
        <label>提醒时间（可不填）<input name="due_at" type="datetime-local"></label>
        <div class="compose-actions"><button type="button" class="secondary" data-todo-close>取消</button><button type="submit" class="primary">保存待办</button></div>
      </form>
    </section>
  </div>
  <div class="modal-backdrop hidden" id="ruleModal">
    <section class="compose-card" role="dialog" aria-modal="true" aria-labelledby="ruleTitle">
      <div class="compose-head"><div><h2 id="ruleTitle">新建分类规则</h2><p>发件人和主题可只填写一项</p></div><button class="icon" data-rule-close>×</button></div>
      <form id="ruleForm">
        <label>规则名称<input name="name" required placeholder="例如：老板的邮件"></label>
        <label>发件人包含<input name="sender_contains" placeholder="姓名、邮箱或公司名称"></label>
        <label>主题包含（可不填）<input name="subject_contains" placeholder="例如：合同、付款"></label>
        <label>标记为<select name="urgency" class="priority-select"><option value="紧急">紧急 !!!</option><option value="普通">普通 !!</option><option value="低">低 !</option></select></label>
        <div class="compose-actions"><button type="button" class="secondary" data-rule-close>取消</button><button type="submit" class="primary">保存规则</button></div>
      </form>
    </section>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/static/app.js?v=8" defer></script>
</body>
</html>
